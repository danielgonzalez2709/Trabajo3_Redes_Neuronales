# documentan en data/fuentes.md. Cada rango es [inicio, fin] inclusive (ISO). Lo que no es receso dentro de `cobertura`
# vale falso; fuera de `cobertura`, o dentro de `vacios` (días que ningún acto cubre), vale nulo (sin fuente; no se imputa).
periodo: {inicio: "2021-01-01", fin: "2024-12-31"}   # núcleo §5.2 (todo el periodo + 30 días); sobrescribible por CLI
consulta_por_defecto: "2026-11-26"
supuestos:
  fin_de_anio: {inicio_mes_dia: "12-15", fin_mes_dia: "01-15", nota: "Supuesto del equipo (sin definición oficial, informe §4); ambos extremos inclusive."}
  semana_santa: {dias_antes_de_pascua: 6, nota: "Ventana del informe §1.1: semana lunes-domingo que termina en el Domingo de Pascua."}
  puente: {nota: "Supuesto del equipo (informe §2): fin de semana largo; sábado, domingo y lunes si el lunes es festivo; viernes, sábado y domingo si el festivo cae en viernes."}

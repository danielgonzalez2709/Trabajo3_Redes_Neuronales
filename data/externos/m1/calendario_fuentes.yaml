    jueves_santo: -3
    viernes_santo: -2
    ascension: 39          # jueves; se traslada al lunes siguiente (Pascua+43)
    corpus_christi: 60     # jueves; TODO(cita); lunes Pascua+64
    sagrado_corazon: 68    # viernes; TODO(cita); lunes Pascua+71

# M3 — modelos de referencia (JJ-4: popularidad, factorización de matrices implícita por ALS y aleatorio) y red de dos torres
# (JJ-5), evaluados en prueba.
# Uso (en este orden; la búsqueda escribe sus ensayos en hpo_ensayos.json; con hiperparametros_desde: config el experimento usa
# los valores de este archivo (copia del mejor ensayo) y solo lee hpo_ensayos.json para reportar el presupuesto):
#   .venv\Scripts\python run.py m3-hpo --config configs/m3/hpo.yaml     # 20 ensayos de Optuna por familia (MF y red), validación
#   .venv\Scripts\python run.py m3     --config configs/m3/base.yaml    # 30 semillas × 4 modelos, una evaluación en prueba
# Sin internet: lee data/processed/m3/ (partición en la columna `split`) y de resumen.json SOLO el bloque sha256 (evidencia).
# Decisiones D9–D19 [DECIDIDO, Juan José, 26/27-nov]: docs/spec/partes/juanjose.md §3.1–§3.3.
#   D9  modelos finales y HPO usan solo train (la búsqueda y la parada temprana, validación; la prueba se evalúa una vez).
#   D10 candidatos = catálogo − historial conocido (prueba: train ∪ validación; validación: train).
#   D12 K ∈ {1, 3, 5, 10}; Recall@K = acierto@K y Precision@K = acierto@K / K (1 destino de prueba por usuario).
#   D14 semillas base_seed + 0…29 (semillas.n = 30) para todos los modelos.
#   D15–D19 red de dos torres (contenido: tipo del destino y preferencias del usuario), pérdida BCE o BPR, negativos uniformes,
#           d ∈ {4, 8, 16, 32}, Adam + weight decay + dropout, parada temprana por NDCG@5 de validación.
# Cambios en vivo sin editar código (núcleo §4.1):
#   --set evaluacion.k=3   --set "evaluacion.k=[1, 3]"   --set semillas.n=5
#   --set modelo.dim_embedding=8   --set modelo.negativos_por_positivo=1   --set perdida.tipo=bpr
#   La MF y la red usan hiperparametros_desde: config [DECIDIDO, Juan José, 27-nov] con los valores copiados del mejor ensayo
#   de m3-hpo, así que las claves de la red cambian el modelo con --set. Mientras la config sea EXACTAMENTE el mejor ensayo de
#   hpo_ensayos.json (misma partición), summary.json reporta el presupuesto real de la búsqueda (20 ensayos y su tiempo; núcleo
#   §6); si un --set lo cambia, ese modelo se reporta como 1 configuración y 0 s (hiperparametros_origen dice cuál). La igualdad
#   se mide solo sobre los hiperparámetros BUSCADOS: un --set sobre un fijo (max_epocas, paciencia, tam_lote, dropout_id,
#   usar_demografia, escala_inicial) no resetea el presupuesto, porque hpo_ensayos.json no guarda los fijos.

datos:
  carpeta: data/processed/m3
  destinos: destinos.parquet
  usuarios: usuarios.parquet
  interacciones: interacciones.parquet           # trae `split` ∈ {train, validacion, prueba} (JJ-3)
  resumen_particion: results/data/m3/particion/resumen.json   # solo se lee su bloque `sha256` (huella y SHA-256 del parquet)

salida:
  carpeta: results/data/m3                       # summary.json, semillas/, metricas_por_k.json, metricas_por_grupo.json,
                                                 # recomendaciones_prueba.parquet y hpo_ensayos.json
  modelos: models/m3                             # factores de la MF de la semilla base_seed + 0

semillas:
  base_seed: 0                                   # semilla efectiva de la corrida r = base_seed + r (src/comun/seeds.py)
  n: 30                                          # D14 y núcleo §6: ≥ 30 semillas

device: cpu                                      # referencias en numpy y red en CPU (D19); se reporta en summary.json

modelos: [popularidad, mf_als, aleatorio, red]   # claves de referencias.MODELOS

evaluacion:
  k: [1, 3, 5, 10]                               # D12 [PROPUESTO por el enunciado: «@K»]; también acepta un entero
  k_lugar: [1, 3]                                # D12: «acierto por lugar» solo para estos K (los que también estén en k)
  top_guardar: 10                                # destinos guardados por usuario en recomendaciones_prueba.parquet
  umbral_pocas_max: 2                            # grupo «pocas» = 1..2 interacciones en total, «muchas» = más; debe ser
                                                 # igual a particion.umbral_pocas_max de configs/m3/datos.yaml (lo prueba un test)

mf_als:
  # «config» [DECIDIDO, Juan José, 27-nov]: los de `hiperparametros`, copiados EXACTOS del mejor ensayo 19 de m3-hpo (27-nov;
  # NDCG@5 de validación 0,0102; lo vigila una prueba). «hpo»: familias.mf_als.mejor de <salida.carpeta>/hpo_ensayos.json.
  # Antes de JJ-5 este bloque tenía valores de respaldo (16, 0,1, 10, 10), elección nuestra.
  hiperparametros_desde: config
  hiperparametros:
    factores: 4
    regularizacion: 0.002104317845122097
    alfa: 1.484941433731389
    iteraciones: 9
  escala_inicial: 0.01                           # desviación de la inicialización N(0, escala²) de X e Y [PROPUESTO: no se busca]
  # Guarda de degeneración (condiciones y derivación: docstring de MFImplicitaALS, src/m3_recomendacion/referencias.py): si
  # max |x_uᵀ y_i| < tolerancia_degenerado los puntajes son numéricamente nulos. La búsqueda nunca elige un ensayo degenerado y
  # el experimento falla con error claro si la MF final lo es. La tolerancia es [PROPUESTO].
  tolerancia_degenerado: 1.0e-8

# =========================================================================== red de dos torres (JJ-5; D15–D19)
# Los cuatro bloques de primer nivel son los hiperparámetros de la red (claves en vivo del núcleo §4.1). Los valores buscados
# están copiados del mejor ensayo 18 de m3-hpo (27-nov; NDCG@5 de validación 0,0067); los marcados [DECIDIDO, fijo] no se
# buscan [DECIDIDO, Juan José, 27-nov]. Con hiperparametros_desde: config mandan estos valores (también en la demo). Si se vuelve
# a correr m3-hpo, hay que volver a copiar el mejor ensayo (lo vigila una prueba).
modelo:
  dim_embedding: 32                              # d ∈ {4, 8, 16, 32} (D18)
  capas_usuario: 1                               # capas ocultas Linear → ReLU → Dropout de la torre de usuario
  unidades_usuario: 64
  capas_destino: 1                               # ídem, torre de destino
  unidades_destino: 16
  usar_id_usuario: true                          # embedding de usuario_id sumado a su MLP (índice 0 = sin id)
  usar_id_destino: true                          # embedding de destino_id sumado a su MLP
  dropout_id: 0.2                                # [DECIDIDO, fijo] prob. de reemplazar el índice de id por 0 en entrenamiento
  negativos_por_positivo: 2                      # m negativos uniformes sobre catálogo − train del usuario (D17)
  usar_demografia: false                         # [DECIDIDO, fijo] true agrega genero, n_adultos, n_ninos one-hot a x_u
perdida:
  tipo: bce                                      # bce | bpr (D16)
entrenamiento:
  lr: 7.434215990914675e-4                       # tasa de aprendizaje de Adam
  max_epocas: 100                                # [DECIDIDO, fijo]
  paciencia: 10                                  # [DECIDIDO, fijo] épocas sin mejorar el NDCG@5 de validación antes de parar
  tam_lote: 256                                  # [DECIDIDO, fijo] positivos por minilote
regularizacion:
  weight_decay: 3.59255347484978e-4             # L2 de Adam (acoplado al gradiente)
  dropout: 0.25122337342804407                  # en las capas ocultas de las dos torres

red:
  # «config» [DECIDIDO, Juan José, 27-nov]: mandan los bloques (`hiperparametros` queda vacío). «hpo»: el mejor ensayo de
  # familias.red de <salida.carpeta>/hpo_ensayos.json va ENCIMA de los bloques.
  hiperparametros_desde: config
  hiperparametros: {}
  # Guarda de degeneración (red.diagnostico_degeneracion): puntajes no finitos, rango de puntajes por usuario < tolerancia o
  # max‖u‖·max‖v_i‖ < tolerancia. [DECIDIDO, Juan José, 27-nov]: 1e-6 porque la red calcula en float32 (la MF usa 1e-8 en float64).
  tolerancia_degenerado: 1.0e-6

# M1 — operación: flota y conductores (CA-3; núcleo §5.4; spec de Camila §3.2–§3.3).
# Uso: python run.py m1-operacion --config configs/m1/operacion.yaml --set operacion.ocupacion_objetivo=0.8 --set operacion.cuantil=0.9
# Fórmula y ecuaciones (1)–(5b): src/m1_demanda/operacion.py. Nada aleatorio; sin red.
#
# Diseño: `operacion` trae SOLO valores escalares (sobrescribibles con --set operacion.<clave>=v,
# --set operacion.por_ruta.<ruta>.<clave>=v, --set operacion.por_clase.<CLASE>.capacidad_pasajeros=v).
# `meta` describe cada valor con {unidad, fuente | supuesto: true, nota}: `meta.globales.<clave>`,
# `meta.por_ruta.<clave>` (común a las seis rutas) y `meta.por_clase.<CLASE>.<clave>`.
# Lo que se calcula con train al ejecutar (composición por clase, fraccion_demanda_en_origen y multiplicador_ocupacion
# m_r por ruta) NO se escribe aquí:
# lleva `fuente` con la ventana usada en results/data/m1/operacion/resumen.json.
# Normas: citas verificadas en docs/investigacion/CA-2_verificacion.md (§1–§3, §6 y §7), consultadas el 2026-11-26.

datos:
  detalle: data/processed/m1/demanda_detalle.parquet
  diaria: data/processed/m1/demanda_diaria.parquet
  rutas: data/processed/m1/rutas.yaml
  inicio_entrenamiento: "2021-06-01"   # núcleo §5.1 [DECIDIDO, Daniel, 24-nov]
  # [PROPUESTO, CA-3] fin del train para todo lo calibrado (núcleo §5.4: solo train). Andrés aún no publica la
  # partición (AN-1); configs/m1/referencia.yaml (CA-5) usa el mismo corte. Reemplazar por el suyo cuando exista.
  fin_entrenamiento: "2022-12-31"

calibracion:
  # [PROPUESTO, Camila, 26-nov] f(r) se calcula con los últimos meses de train para captar el régimen reciente
  # (11001-15759: el tránsito sube desde el 8-nov-2022 y f cae de 0,417 a 0,31).
  meses_fraccion: 2
  # [DECIDIDO, Camila, 26-nov, CA-3d] Validación fuera de ventana de ρ* y m_r: se recalibra todo (composición, capacidad,
  # f, ρ*, m_r) solo con fecha <= calibrar[1] y se mide la reproducción de despachos ORIGEN en `probar` (ambas en train).
  validacion:
    calibrar: ["2022-09-01", "2022-10-31"]
    probar: ["2022-11-01", "2022-12-31"]
  fuente_datos: >-
    Superintendencia de Transporte (2026), Operación de pasajeros y despacho de vehículos en la modalidad de
    transporte de pasajeros por carretera, datos.gov.co eh75-8ah6 (data/processed/m1/demanda_detalle.parquet)

ejemplo:
  mes: "2022-12"    # demanda de EJEMPLO mientras no hay pronósticos (AN-5): mes de train con fin de año

salida:
  carpeta: results/data/m1/operacion

operacion:
  ocupacion_objetivo: 0.61
  cuantil: 0.9
  horas_operacion_h: 18
  jornada_efectiva_h: 7
  jornada_max_diaria_h: 8
  jornada_max_semanal_h: 42
  ausentismo: 0.09
  umbral_segundo_conductor_h: 8
  dias_descanso_semana: 1
  costo_pasajero_sin_atender: 1.0
  costo_vehiculo_dia_sobrante: 1.0
  por_ruta:
    11001-76001: {tiempo_ciclo_h: 22, tiempo_recorrido_h: 10}
    76001-11001: {tiempo_ciclo_h: 22, tiempo_recorrido_h: 10}
    11001-15759: {tiempo_ciclo_h: 9, tiempo_recorrido_h: 4}
    15759-11001: {tiempo_ciclo_h: 9, tiempo_recorrido_h: 4}
    52001-52356: {tiempo_ciclo_h: 3.5, tiempo_recorrido_h: 1.5}
    52356-52001: {tiempo_ciclo_h: 3.5, tiempo_recorrido_h: 1.5}
  # cap(c) = min(máx. del grupo, max(mín. del grupo, ⌈máximo de pasajeros/despacho ORIGEN en train⌉)); grupos del
  # Decreto 1079/2015 arts. 2.2.1.4.7.3–4. tests/test_operacion_m1.py recalcula la regla con los datos.
  por_clase:
    AUTOMOVIL: {capacidad_pasajeros: 5}
    BUS: {capacidad_pasajeros: 40}
    BUSETA: {capacidad_pasajeros: 30}
    CAMIONETA: {capacidad_pasajeros: 9}
    CAMPERO: {capacidad_pasajeros: 9}
    MICROBUS: {capacidad_pasajeros: 19}

meta:
  globales:
    ocupacion_objetivo:
      unidad: fracción de la capacidad
      supuesto: true
      nota: >-
        Sin norma hallada (CA-2). [DECIDIDO, Camila, 26-nov, CA-3c] Calibrada con train en la MISMA ventana que f
        (últimos calibracion.meses_fraccion meses de train, 2022-11-01..2022-12-31, días con registro): ρ* = Σ f·D/cap_ef
        ÷ Σ despachos ORIGEN observados = 0,6063 → 0,61 (con todo el train sería 0,5396); tests/test_operacion_m1.py la
        recalcula con los datos. Es UN escalar (control de la app y --set). [DECIDIDO, Camila, 26-nov, CA-3d] Cada ruta
        usa ρ_r = min(1, ρ · m_r), con m_r = ρ_r observada / ρ* calibrado al ejecutar en la misma ventana (resumen.json,
        multiplicador_ocupacion): con un solo ρ global el total se reproduce, con desajuste por ruta (en la ventana 11001-15759
        46 %, 15759-11001 64 %, 52001-52356 134 %, 52356-52001 132 %); con ρ · m_r cada ruta queda en 100–101 %. Fuera de
        ventana (calibrar sep–oct 2022, probar nov–dic 2022) ρ · m_r da 102–108 % en 5 de 6 rutas frente a 67–142 % con
        ρ global; 11001-15759 queda en 172 % por su cambio de régimen (el tránsito sube desde el 8-nov-2022).
        LIMITACIONES: (i) ρ* y m_r incluyen el pico de diciembre (fin de año) de la ventana, así que describen la
        ocupación de temporada alta más que la de una semana normal; (ii) la demanda observada está censurada por la
        oferta (solo se registran los pasajeros que consiguieron silla), así que ρ observada mide la carga media de los
        despachos que salieron, no la ocupación que habría con más oferta; (iii) m_r supone que la relación entre rutas
        se mantiene en el periodo que se planea. Se analiza por sensibilidad.
    cuantil:
      unidad: cuantil del pronóstico
      supuesto: true
      nota: >-
        Decisión de negocio, no norma. Debe ser uno de los cuantiles del arnés (núcleo §5.3: 0.5, 0.75, 0.9, 0.95);
        otro valor da error. Se compara contra el punto en negocio 3 (Andrés).
    horas_operacion_h:
      unidad: horas por día
      supuesto: true
      nota: >-
        Sin fuente oficial (CA-2 §4). Horas al día en que un vehículo puede estar operando; solo entra en las vueltas
        (ec. (3)), no en los conductores. TODO(dato-faltante): horario real de despachos de las terminales.
    jornada_efectiva_h:
      unidad: horas de conducción por conductor y día
      supuesto: true
      nota: >-
        No hay norma colombiana de horas de conducción ni de pausas (CA-2 verificación §5); la Res. 315/2013 art. 6
        solo pide «garantizar los descansos necesarios». Supuesto: 7 h de conducción dentro de la jornada máxima
        diaria de 8 h; la hora restante cubre pausas y tareas en terminal (el alistamiento no se cuenta como
        conducción). Con s = 1: 7 · 6 = 42 h ≤ jornada_max_semanal_h. LIMITACIÓN: eso cumple la jornada semanal solo
        si la hora de pausa NO es tiempo a disposición del empleador; si lo fuera, serían 8 · 6 = 48 h > 42 h.
        SUPUESTO de la ec. (5a) [DECIDIDO, Camila, 26-nov, CA-3c]: con k conductores a bordo cada uno maneja t / k
        horas por pierna y el relevo que descansa a bordo no consume jornada. [DECIDIDO, Camila, 26-nov, CA-3d]
        k = max(k_norma, ⌈t / J_ef⌉), así que t / k ≤ J_ef siempre (con t = 7,5 h y k = 1 un conductor manejaría
        7,5 · 6 = 45 h/semana > 42). Las piernas son indivisibles: piernas por conductor y día = ⌊J_ef / (t / k)⌋ ≥ 1.
    jornada_max_diaria_h:
      unidad: horas por día
      fuente: >-
        Congreso de la República de Colombia (2025). Ley 2466 de 2025, art. 11 (art. 161 CST): «La duración máxima de
        la jornada ordinaria de trabajo es de ocho (8) horas al día…». Diario Oficial No. 53.160, 25-jun-2025.
        http://www.secretariasenado.gov.co/senado/basedoc/ley_2466_2025.html
      nota: >-
        Rige desde el 25-jun-2025; entre el 15-jul-2021 y el 24-jun-2025 el art. 161 vigente (Ley 2101, art. 2) no
        fija tope diario; no citar la Ley 50/1990 (CA-2 verificación §7).
    jornada_max_semanal_h:
      unidad: horas por semana
      fuente: >-
        Congreso de la República de Colombia (2021). Ley 2101 de 2021, art. 3 (reducción gradual hasta «cuarenta y dos
        (42) horas semanales»), y Ley 2466 de 2025, art. 11 (art. 161 CST): «…una jornada máxima de cuarenta y dos (42)
        horas a la semana». Ministerio del Trabajo, comunicado del 15-jul-2026: «Desde hoy entra en vigor la última
        etapa de la Ley 2101 de 2021, con la cual la jornada laboral máxima semanal en Colombia se reduce de 44 a 42
        horas.»
      nota: >-
        42 h desde el 15-jul-2026 (la operación que se planea es posterior). En el periodo de los datos regían 48 h
        (hasta el 14-jul-2023) y 47 h (MinTrabajo, concepto 08SE20231203000000048585). Se exige
        jornada_efectiva_h · (7 − dias_descanso_semana) ≤ este valor.
    ausentismo:
      unidad: fracción de los conductores
      supuesto: true
      nota: >-
        Sin cifra oficial para conductores (CA-2 §5). Orden de magnitud del único dato hallado (9,18 %, Secretaría
        Distrital de la Mujer 2025, no representativo según CA-2 §5). TODO(cita) opcional: encuesta ANDI-Cestla.
    umbral_segundo_conductor_h:
      unidad: horas de recorrido entre origen y destino
      fuente: >-
        Ministerio de Transporte (2013). Resolución 315 de 2013, art. 6: «…para la realización de operaciones de
        transporte con una duración superior a ocho (8) horas de recorrido entre el lugar de origen y el lugar de
        destino, deberán contar con un segundo conductor». Diario Oficial No. 48.697, 7-feb-2013.
      nota: >-
        Vigente: no derogada por la Res. 20223040045295/2022 (art. 9.2.1) ni afectada por el Decreto 1079/2015
        (art. 3.1.1) (CA-2 verificación §3). Se aplica siempre: k_norma = 2 si tiempo_recorrido_h > 8. La tripulación
        usada es k = max(k_norma, ⌈t / jornada_efectiva_h⌉) (ec. (5a)): la norma es el mínimo, no el máximo.
    dias_descanso_semana:
      unidad: días por conductor y semana
      fuente: >-
        Congreso de la República de Colombia (2025). Ley 2466 de 2025, art. 11 (art. 161 CST): «La jornada máxima
        semanal podrá ser distribuida … de cinco (5) a seis (6) días a la semana, garantizando siempre el día de
        descanso…» (igual en la Ley 2101 de 2021, art. 2).
      nota: >-
        Factor 7/(7 − s) de la nómina diaria (5b) y divisor (7 − s) de la nómina semanal N* (5b). Debe ser ≥ 1.
    costo_pasajero_sin_atender:
      unidad: unidades relativas por pasajero
      supuesto: true
      nota: >-
        Decisión de negocio sin cifra oficial (CA-2 §5); núcleo §5.4 lo exige y lo usa negocio 3 (CA-6).
        dimensionar no los usa. Solo importa la razón con el costo de sobrar.
    costo_vehiculo_dia_sobrante:
      unidad: unidades relativas por vehículo-día
      supuesto: true
      nota: >-
        Decisión de negocio sin cifra oficial (CA-2 §5); núcleo §5.4 lo exige y lo usa negocio 3 (CA-6).
        dimensionar no los usa. Solo importa la razón con el costo de quedarse corto.
  por_ruta:
    tiempo_ciclo_h:
      unidad: horas (ida + regreso + alistamiento)
      supuesto: true
      nota: >-
        Sin fuente oficial (CA-2 §4); TODO(dato-faltante). Bogotá–Cali 2 × 10 h + 2 h de alistamiento = 22 h (más que
        las horas de operación: v = 18/22 < 1 vuelta por día); Bogotá–Sogamoso 2 × 4 h + 1 h = 9 h; Pasto–Ipiales
        2 × 1,5 h + 0,5 h = 3,5 h. Igual en los dos sentidos del corredor.
    tiempo_recorrido_h:
      unidad: horas por sentido
      supuesto: true
      nota: >-
        Sin fuente oficial (CA-2 §4: INVÍAS no se pudo abrir); TODO(dato-faltante). Bogotá–Cali 10 h (medios y blogs
        citados en CA-2 §4 dan 9,5 a 13,5 h, NO citables; > 8 h → segundo conductor por la Res. 315/2013 art. 6, y cada
        conductor maneja t / k = 5 h por pierna, supuesto en la nota de jornada_efectiva_h); Bogotá–Sogamoso 4 h y
        Pasto–Ipiales 1,5 h sin fuente ni secundaria.
  # Máximos medidos con `capacidad_observada` (ORIGEN, despachos > 0, 2021-06-01..2022-12-31). Se regeneran en
  # results/data/m1/operacion/capacidad_observada.csv. Limitaciones en la nota de cada clase.
  por_clase:
    AUTOMOVIL:
      capacidad_pasajeros:
        unidad: pasajeros por vehículo
        supuesto: true
        nota: >-
          Grupo A, «4 a 9 pasajeros» (Decreto 1079 de 2015, arts. 2.2.1.4.7.3–2.2.1.4.7.4, que compilan el Decreto
          171/2001, arts. 50–51; la norma da rangos, no capacidades, y no dice si incluye al conductor). Máximo
          observado 5,00 (1.035 días) → 5. LIMITACIÓN: el máximo de promedios diarios por despacho es una cota baja de
          la capacidad física y es sensible a datos atípicos.
    BUS:
      capacidad_pasajeros:
        unidad: pasajeros por vehículo
        supuesto: true
        nota: >-
          Grupo C, «más de 19 pasajeros» (Decreto 1079 de 2015, arts. 2.2.1.4.7.3–2.2.1.4.7.4; sin tope). Máximo
          observado 40,00 (3.382 días) → 40. LIMITACIÓN: el máximo de promedios diarios por despacho es una cota
          baja de la capacidad física y es sensible a datos atípicos (un solo día alto lo fija; 40 puede serlo).
    BUSETA:
      capacidad_pasajeros:
        unidad: pasajeros por vehículo
        supuesto: true
        nota: >-
          Grupo C, «más de 19 pasajeros» (Decreto 1079 de 2015, arts. 2.2.1.4.7.3–2.2.1.4.7.4; sin tope). Máximo
          observado 30,00 (solo 166 días) → 30. LIMITACIÓN: máximo de promedios diarios = cota baja de la capacidad
          física, sensible a atípicos, y con pocos días.
    CAMIONETA:
      capacidad_pasajeros:
        unidad: pasajeros por vehículo
        supuesto: true
        nota: >-
          Grupo A, «4 a 9 pasajeros» (Decreto 1079 de 2015, arts. 2.2.1.4.7.3–2.2.1.4.7.4; la norma no dice si incluye
          al conductor: con conductor incluido serían 8). Máximo observado 9,00 (585 días) → 9. LIMITACIÓN: máximo de
          promedios diarios = cota baja de la capacidad física, sensible a atípicos.
    CAMPERO:
      capacidad_pasajeros:
        unidad: pasajeros por vehículo
        supuesto: true
        nota: >-
          Grupo A, «4 a 9 pasajeros» (Decreto 1079 de 2015, arts. 2.2.1.4.7.3–2.2.1.4.7.4; la norma no dice si incluye
          al conductor: con conductor incluido serían 8). Máximo observado 8,15 (579 días) → 9. LIMITACIÓN: máximo de
          promedios diarios = cota baja de la capacidad física, sensible a atípicos.
    MICROBUS:
      capacidad_pasajeros:
        unidad: pasajeros por vehículo
        supuesto: true
        nota: >-
          Grupo B, «10 a 19 pasajeros» (Decreto 1079 de 2015, arts. 2.2.1.4.7.3–2.2.1.4.7.4). Máximo observado 18,66
          (2.315 días) → 19. LIMITACIÓN: máximo de promedios diarios = cota baja de la capacidad física, sensible a
          atípicos.

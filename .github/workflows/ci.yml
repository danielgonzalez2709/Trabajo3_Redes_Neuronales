name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # torch y torchvision de CPU primero y del MISMO índice (la rueda de PyPI en Linux trae CUDA y pesa varios GB).
      # Si torchvision viene de PyPI (compilado contra el torch de CUDA) sus operadores C++ no se registran sobre el
      # torch +cpu: «RuntimeError: operator torchvision::nms does not exist». El resto queda fijado en requirements.txt.
      - run: pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m "not lento"
      # App (Next.js estático en app/): mismos pasos que en el Trabajo 2. Van en este mismo job para que el check
      # obligatorio `pruebas` también falle si se rompe la app.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: npm --prefix app test
      - run: npm --prefix app run build
